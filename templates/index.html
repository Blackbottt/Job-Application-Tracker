<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main class="applications">
        <form id="applications-form">
            <label for="company">Company:</label>
            <input 
                class="input-field"
                type="text" 
                name="Company-name" 
                id="company" 
                placeholder="COMPANY" 
                required
            >
            <label for="position">Position:</label>
            <input
                class="input-field" 
                type="text" 
                name="position-name" 
                id="position" 
                placeholder="POSITION" 
                required
            >
            <label for="application-date">Application Date:</label>
            <input 
                class="input-field"
                type="date" 
                name="application-date" 
                id="application-date" 
                placeholder="APPLICATION DATE" 
                required
            >
            <label for="status">STATUS:</label>
            <input 
                class="input-field"
                type="text" 
                name="status-type" 
                id="status" 
                placeholder="STATUS" 
                required
            >
            <button type="submit" class="submit-applications">Add Task</button>
        </form>
        <section id="dashboard" class="dashboard">
            <table class="applications-table" id="applications-table">
            <caption>Job Applications</caption>
            <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Position</th>
                <th>Application Date</th>
                <th>Status</th>
                <th>Notes</th>
                <th>Job URL</th>
                <th>created at</th>
            </tr>
        </table>
        </section>
    </main>
</body>
</html>
